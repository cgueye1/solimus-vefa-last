name: Deploy to AWS Production

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'terraform/**'
      - 'docs/**'
      - '**.md'
      - '.github/workflows/deploy-dev.yml'

env:
  AWS_REGION: eu-west-3
  PROJECT: solimus-vefa

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy Backend to AWS
    runs-on: ubuntu-latest
    
    steps:
      # ====== CHECKOUT ======
      - name: Checkout code
        uses: actions/checkout@v4
      
      # ====== SETUP JDK ======
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      # ====== BUILD ======
      - name: Build with Maven
        run: |
          mvn clean package \
            -DskipTests \
            -Dspring.profiles.active=prod \
            -Dproject.version=${{ github.run_number }}
      
      # ====== AWS CREDENTIALS (via OIDC) ======
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      # ====== ECR LOGIN ======
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      # ====== BUILD & PUSH DOCKER IMAGE ======
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.PROJECT }}-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg CONFIGURATION=prod \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
      
      # ====== DEPLOY TO EC2 ======
      - name: Deploy to EC2 via SSM Session Manager
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.PROJECT }}-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$INSTANCE_ID" \
            --parameters 'commands=[
              "cd /opt/solimus-vefa",
              "docker-compose pull",
              "docker-compose down",
              "docker-compose up -d",
              "docker-compose logs -f backend"
            ]'
      
      # ====== HEALTH CHECK ======
      - name: Health check
        run: |
          echo "Waiting for application to be ready..."
          for i in {1..30}; do
            if curl -f -s https://api.vefa.solimus.sn/actuator/health > /dev/null 2>&1; then
              echo "✓ Application is healthy"
              exit 0
            fi
            echo "Attempt $i/30: Waiting for application..."
            sleep 10
          done
          echo "✗ Health check failed"
          exit 1
      
      # ====== NOTIFY SUCCESS ======
      - name: Deployment Success
        if: success()
        run: |
          echo "✅ Backend successfully deployed to AWS!"
          echo "API URL: https://api.vefa.solimus.sn"
          echo "Commit: ${{ github.sha }}"
      
      # ====== NOTIFY FAILURE ======
      - name: Deployment Failure
        if: failure()
        run: |
          echo "❌ Backend deployment failed!"
          echo "Check the logs above for details"
          exit 1
