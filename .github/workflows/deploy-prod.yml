name: Deploy backend to AWS (prod)

on:
  push:
    branches: [prod-aws]
    paths-ignore:
      - 'terraform/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  id-token: write   # nécessaire pour OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Tests
        run: ./mvnw -B test

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          docker build -t ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }} .
          docker push ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}

      - name: Deploy on EC2 (SSM)
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids ${{ vars.INSTANCE_ID }} \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["/opt/app/deploy.sh ${{ github.sha }}"]' \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" \
            --instance-id ${{ vars.INSTANCE_ID }} || {
            aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id ${{ vars.INSTANCE_ID }} \
              --query StandardErrorContent --output text
            exit 1
          }

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://api.vefa.solimus.sn/actuator/health; then
              echo " Application OK"; exit 0
            fi
            echo "Tentative $i/30..."; sleep 10
          done
          echo "Health check failed"; exit 1