server.port=${SERVER_PORT:8087}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
app.image.upload-url=http://184.174.39.115/repertoire_samater

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER
logging.level.org.springframework.security=DEBUG
spring.websocket.path=/ws

server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.servlet.multipart.max-file-size=3GB
spring.servlet.multipart.max-request-size=3GB

spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=ssl0.ovh.net

otp.test-email=${OTP_TEST_EMAIL:}

whatsapp.graph.version=${WHATSAPP_GRAPH_VERSION:v25.0}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN}
whatsapp.otp.template=${WHATSAPP_OTP_TEMPLATE:otp_code}
whatsapp.otp.language=${WHATSAPP_OTP_LANGUAGE:en}
whatsapp.otp.button-parameter=${WHATSAPP_OTP_BUTTON_PARAMETER:123456}
whatsapp.test-mode=${WHATSAPP_TEST_MODE:false}
whatsapp.test-phone-number=${WHATSAPP_TEST_PHONE_NUMBER:}

spring.cache.type=caffeine
spring.cache.cache-names=properties,dashboard,stats,lists,progressAlbums
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=60s

angular.url.success=${ANGULAR_URL_SUCCESS:http://localhost:4200/#/settings/accounts?status=success}
angular.url.failed=${ANGULAR_URL_FAILED:http://localhost:4200/#/settings/accounts?status=failed}

minio.url=${MINIO_URL}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=${MINIO_BUCKET:solimus}
