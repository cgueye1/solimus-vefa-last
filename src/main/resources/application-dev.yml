spring:
  application:
    name: solimus-vefa-backend

  # Base de données : tout vient de .env
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  # Email
  mail:
    host: ${SPRING_MAIL_HOST:ssl0.ovh.net}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: ssl0.ovh.net

  servlet:
    multipart:
      max-file-size: 3GB
      max-request-size: 3GB

  cache:
    type: caffeine
    cache-names: properties,dashboard,stats,lists,progressAlbums
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60s

  websocket:
    path: /ws

server:
  port: ${SERVER_PORT:8086}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    com.wakana.vefa: DEBUG

app:
  front-url: ${FRONT_URL:https://dev-vefa.solimus.sn}
  api-url: ${API_URL:https://api-dev-vefa.solimus.sn}
  payment-ipn-url: ${PAYMENT_IPN_URL:https://api-dev-vefa.solimus.sn/api/payment/ipn}

# Stockage générique (S3 / MinIO) : en dev, on réutilise les variables MINIO_*
storage:
  type: ${STORAGE_TYPE:minio}
  endpoint: ${STORAGE_ENDPOINT:${MINIO_URL}}
  path-style: ${STORAGE_PATH_STYLE:true}
  access-key: ${STORAGE_ACCESS_KEY:${MINIO_ACCESS_KEY}}
  secret-key: ${STORAGE_SECRET_KEY:${MINIO_SECRET_KEY}}
  bucket: ${FILES_BUCKET:${MINIO_BUCKET}}
  region: ${AWS_REGION:eu-west-3}

# MinIO (utilisé par MinioService)
minio:
  enabled: ${MINIO_ENABLED:true}
  url: ${MINIO_URL}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}

angular:
  url:
    success: ${ANGULAR_URL_SUCCESS:https://dev-vefa.solimus.sn/#/settings/accounts?status=success}
    failed: ${ANGULAR_URL_FAILED:https://dev-vefa.solimus.sn/#/settings/accounts?status=failed}

whatsapp:
  graph:
    version: ${WHATSAPP_GRAPH_VERSION:v25.0}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
  otp:
    template: ${WHATSAPP_OTP_TEMPLATE:otp_code}
    language: ${WHATSAPP_OTP_LANGUAGE:en}
    button-parameter: ${WHATSAPP_OTP_BUTTON_PARAMETER:123456}
  test-mode: ${WHATSAPP_TEST_MODE:false}
  test-phone-number: ${WHATSAPP_TEST_PHONE_NUMBER:}

otp:
  test-email: ${OTP_TEST_EMAIL:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    try-it-out-enabled: true