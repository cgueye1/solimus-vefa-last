spring:
  application:
    name: solimus-vefa-backend

  # Base de données (production - AWS RDS)
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 900000
      max-lifetime: 1800000

  # JPA / Hibernate : le schéma est géré par Flyway, Hibernate se contente de vérifier
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

  sql:
    init:
      mode: never

  # Flyway : sur une base déjà remplie, marque l'état actuel comme version 1
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    out-of-order: false

  # Email (OVH)
  mail:
    host: ${SPRING_MAIL_HOST:ssl0.ovh.net}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: ssl0.ovh.net

  # Envoi de fichiers
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  # Cache
  cache:
    type: caffeine
    cache-names: properties,dashboard,stats,lists,progressAlbums
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=300s

  # WebSocket
  websocket:
    path: /ws

# Actuator : uniquement l'état de santé, sans détails
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Serveur (HTTPS géré par Caddy)
server:
  port: ${SERVER_PORT:8086}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 2048
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}

# Logs : sortie console uniquement (lisibles avec docker logs)
logging:
  level:
    root: WARN
    org.springframework.web: WARN
    org.springframework.security: INFO
    com.wakana.vefa: INFO

# URLs de l'application
app:
  front-url: ${FRONT_URL:https://vefa.solimus.sn}
  api-url: ${API_URL:https://api.vefa.solimus.sn}
  payment-ipn-url: ${PAYMENT_IPN_URL:https://api.vefa.solimus.sn/api/payment/ipn}

# Stockage : AWS S3 via le rôle IAM de l'instance (aucune clé)
storage:
  type: ${STORAGE_TYPE:s3}
  endpoint: ${STORAGE_ENDPOINT:}
  path-style: ${STORAGE_PATH_STYLE:false}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
  bucket: ${FILES_BUCKET}
  region: ${AWS_REGION:eu-west-3}

# URLs de retour du front (Angular)
angular:
  url:
    success: ${ANGULAR_URL_SUCCESS:https://vefa.solimus.sn/#/settings/accounts?status=success}
    failed: ${ANGULAR_URL_FAILED:https://vefa.solimus.sn/#/settings/accounts?status=failed}

# WhatsApp
whatsapp:
  graph:
    version: ${WHATSAPP_GRAPH_VERSION:v25.0}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID}
  access-token: ${WHATSAPP_ACCESS_TOKEN}
  otp:
    template: ${WHATSAPP_OTP_TEMPLATE:otp_code}
    language: ${WHATSAPP_OTP_LANGUAGE:en}
    button-parameter: ${WHATSAPP_OTP_BUTTON_PARAMETER:123456}
  test-mode: ${WHATSAPP_TEST_MODE:false}
  test-phone-number: ${WHATSAPP_TEST_PHONE_NUMBER:}

# OTP
otp:
  test-email: ${OTP_TEST_EMAIL:}

# Documentation de l'API : désactivée par défaut en production
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    try-it-out-enabled: false