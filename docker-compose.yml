version: '3.7'
services:
  app:
  
    image: cheikhgueye/wolofbiblio:latest
    ports:
      - 8081:8081
    environment:
      SPRING_PROFILES_ACTIVE: production
    depends_on:
      - db

  db:
    image: mysql:latest
    restart: always
    environment:
      MYSQL_DATABASE: snv_db
      MYSQL_USER:  root

      MYSQL_ROOT_PASSWORD: cheikh
    ports:
      - 3306:3306
    volumes:
      - ./data:/var/lib/mysql

