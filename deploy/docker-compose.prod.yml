# docker-compose de PRODUCTION (EC2 AWS).
# Envoyé sur le serveur par GitHub Actions à chaque déploiement
# (copié en /opt/solimus-vefa/docker-compose.yml) : ne pas le modifier sur le serveur.
# Le docker-compose.yml à la racine du dépôt reste celui du développement.

services:
  backend:
    image: solimus-vefa:latest          # image téléchargée depuis ECR par deploy-prod.sh
    container_name: solimus-vefa-backend
    restart: unless-stopped
    env_file: .env                      # régénéré depuis SSM Parameter Store à chaque déploiement
    ports:
      - "127.0.0.1:8086:8086"           # accessible uniquement par Caddy (HTTPS), jamais depuis Internet
    logging:
      driver: json-file
      options:
        max-size: "20m"                 # les logs ne peuvent pas remplir le disque
        max-file: "5"
